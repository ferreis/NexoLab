name: Gerar lockfile do Mermaid na Dev

# Temporário: sincroniza o lockfile após adicionar Mermaid; removido após uso.
on:
  push:
    branches: [Dev]
    paths:
      - package.json
      - .github/workflows/gerar-lock-mermaid.yml

permissions:
  contents: write

jobs:
  lockfile:
    name: Atualizar dependências e registrar package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código da branch Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar lockfile sem executar scripts de pacotes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Registrar lockfile na branch Dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sincronizar lockfile Mermaid"
            for tentativa in 1 2 3 4 5; do
              git fetch origin +refs/heads/Dev:refs/remotes/origin/Dev
              git rebase origin/Dev
              if git push origin HEAD:Dev; then
                exit 0
              fi
              sleep 2
            done
            echo "Não foi possível atualizar o lockfile após cinco tentativas." >&2
            exit 1
          fi
