name: Testes e build do NexoDB Lab

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [main, Dev]
  workflow_dispatch:

permissions:
  contents: read

# Evita testes duplicados quando a mesma alteração dispara push e PR na Dev.
concurrency:
  group: validacao-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Validar código, compilação e navegação com Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências do projeto
        run: npm ci
      - name: Verificar vulnerabilidades altas e críticas nas dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Executar testes unitários
        run: npm test
      - name: Compilar aplicação para produção
        run: npm run build
      - name: Instalar Playwright fixado sem alterar o lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Preparar navegador Chromium para testes de interface
        run: npx --no-install playwright install --with-deps chromium
      - name: Executar testes automatizados de interface com Playwright
        run: npm run test:e2e
