name: Testes e build do NexoDB Lab

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [main, Dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testar
        run: npm test
      - name: Compilar
        run: npm run build
